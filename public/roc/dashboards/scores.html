<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OVIX Volatility Tape — ROC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   OVIX VOLATILITY TAPE — operator-grade dashboard (hub-007)
   Mission Control theme. NO ORANGE (#f97316).
   bg #0b1120 · panels #0f1729/#111927 · text #f1f5f9/#94a3b8
   cyan #22d3ee = interactive ONLY · amber #f59e0b = elevated
   green #10b981 = normal · red #ef4444 = high severity
   ============================================================ */
:root {
  --bg: #0b1120;
  --panel: #0f1729;
  --panel2: #111927;
  --border: #1e293b;
  --border2: #243044;
  --text: #f1f5f9;
  --dim: #94a3b8;
  --dim2: #64748b;
  --cyan: #22d3ee;       /* interactive only */
  --green: #10b981;      /* normal / healthy */
  --amber: #f59e0b;      /* elevated / warning */
  --red: #ef4444;        /* high severity */
  --mono: 'IBM Plex Mono','SF Mono','JetBrains Mono',monospace;
  --sans: 'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; }
body {
  background:var(--bg); color:var(--text); font-family:var(--sans);
  height:100vh; display:flex; flex-direction:column; overflow:hidden;
  font-size:13px; -webkit-font-smoothing:antialiased;
}
.mono { font-family:var(--mono); font-variant-numeric:tabular-nums; }

/* ---------- COMPOSITE BAND ---------- */
.band {
  display:flex; align-items:center; gap:18px;
  padding:10px 18px; background:var(--panel); border-bottom:1px solid var(--border);
  flex-shrink:0; min-height:62px;
}
.band-title { font-size:11px; font-weight:700; color:var(--cyan); letter-spacing:2px; white-space:nowrap; }
.band-title small { display:block; font-size:8px; color:var(--dim2); letter-spacing:1.5px; font-weight:500; }
.band-composite { display:flex; align-items:baseline; gap:8px; }
.band-composite .val { font-family:var(--mono); font-size:34px; font-weight:700; line-height:1; }
.band-composite .scale { font-size:11px; color:var(--dim2); }
.band-dir { display:flex; flex-direction:column; align-items:flex-start; gap:1px; }
.dir-arrow { font-size:14px; font-weight:700; line-height:1; }
.dir-delta { font-family:var(--mono); font-size:11px; }
.level-badge { padding:3px 11px; border-radius:3px; font-size:10px; font-weight:700; letter-spacing:1px; border:1px solid; }
.vol-badge {
  padding:2px 8px; border-radius:3px; font-size:9px; font-weight:700; letter-spacing:1px;
  border:1px solid; white-space:nowrap;
}
.vol-STABLE { color:var(--dim); border-color:var(--border2); background:rgba(148,163,184,0.06); }
.vol-RISING { color:var(--amber); border-color:rgba(245,158,11,0.4); background:rgba(245,158,11,0.08); }
.vol-HIGH   { color:var(--red); border-color:rgba(239,68,68,0.5); background:rgba(239,68,68,0.1); }
.band-spark { flex-shrink:0; }
.band-right { margin-left:auto; display:flex; align-items:center; gap:16px; }
.updated { font-family:var(--mono); font-size:10px; color:var(--dim); display:flex; align-items:center; gap:6px; white-space:nowrap; }
.pulse { width:8px; height:8px; border-radius:50%; background:var(--green); box-shadow:0 0 0 0 rgba(16,185,129,0.6); animation:pulse 2s infinite; }
@keyframes pulse {
  0% { box-shadow:0 0 0 0 rgba(16,185,129,0.5); }
  70% { box-shadow:0 0 0 7px rgba(16,185,129,0); }
  100% { box-shadow:0 0 0 0 rgba(16,185,129,0); }
}
.feeds { font-family:var(--mono); font-size:10px; color:var(--dim); white-space:nowrap; }
.feeds b { color:var(--text); }

/* transport (ROC carousel) — preserved */
.transport { display:flex; align-items:center; gap:4px; flex-shrink:0; }
.transport button { background:rgba(34,211,238,0.07); border:1px solid rgba(34,211,238,0.28); color:var(--cyan); font-size:12px; width:26px; height:22px; border-radius:3px; cursor:pointer; padding:0; }
.transport button:hover { background:rgba(34,211,238,0.2); }

/* ---------- BODY: tape + drill ---------- */
.body { flex:1; display:flex; min-height:0; }

/* tape */
.tape { flex:1; display:flex; flex-direction:column; min-width:0; overflow:hidden; }
.tape-head, .row {
  display:grid;
  grid-template-columns: 150px 96px 110px 92px 1fr 56px 40px;
  align-items:center; gap:10px;
}
.tape-head {
  padding:7px 18px; font-size:9px; letter-spacing:1px; color:var(--dim2); font-weight:600;
  border-bottom:1px solid var(--border); background:var(--panel2); flex-shrink:0; text-transform:uppercase;
}
.rows { flex:1; overflow-y:auto; }
.row {
  padding:0 18px; height:54px; border-bottom:1px solid var(--border);
  cursor:pointer; position:relative; transition:background .12s ease;
}
.row:hover { background:rgba(34,211,238,0.05); }
.row.selected { background:rgba(34,211,238,0.09); box-shadow:inset 3px 0 0 var(--cyan); }
.row.flash { animation:rowflash 1.6s ease-out; }
@keyframes rowflash {
  0% { background:rgba(34,211,238,0.28); }
  100% { background:transparent; }
}
.cell-domain { display:flex; flex-direction:column; gap:2px; min-width:0; }
.cell-domain .name { font-weight:600; font-size:13px; text-transform:capitalize; letter-spacing:.3px; }
.cell-domain .meta { font-size:9px; color:var(--dim2); font-family:var(--mono); }
.cell-score { display:flex; align-items:baseline; gap:6px; }
.cell-score .s { font-family:var(--mono); font-size:21px; font-weight:700; line-height:1; }
.cell-dir { display:flex; flex-direction:column; align-items:flex-start; line-height:1.1; }
.cell-dir .a { font-size:12px; font-weight:700; }
.cell-dir .d { font-family:var(--mono); font-size:9px; }
.cell-driver { font-size:11px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.inc-badge {
  display:inline-flex; align-items:center; justify-content:center; min-width:24px; height:20px; padding:0 6px;
  border-radius:10px; font-family:var(--mono); font-size:11px; font-weight:700;
  background:rgba(239,68,68,0.12); color:var(--red); border:1px solid rgba(239,68,68,0.35);
}
.inc-badge.zero { background:transparent; color:var(--dim2); border-color:var(--border2); }
.feed-dot { width:9px; height:9px; border-radius:50%; margin:0 auto; }
.feed-dot.ok { background:var(--green); }
.feed-dot.dead { background:var(--red); box-shadow:0 0 6px rgba(239,68,68,0.6); }

/* ---------- DRILL PANEL ---------- */
.drill {
  width:0; flex-shrink:0; background:var(--panel); border-left:1px solid var(--border);
  overflow:hidden; transition:width .18s ease; display:flex; flex-direction:column;
}
.drill.open { width:400px; }
.drill-head {
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:12px 16px; border-bottom:1px solid var(--border); flex-shrink:0;
}
.drill-head .dh-left { display:flex; align-items:baseline; gap:10px; min-width:0; }
.drill-head .dh-name { font-size:15px; font-weight:700; text-transform:capitalize; }
.drill-head .dh-score { font-family:var(--mono); font-size:20px; font-weight:700; }
.drill-close { background:none; border:1px solid var(--border2); color:var(--dim); width:24px; height:24px; border-radius:4px; cursor:pointer; font-size:14px; line-height:1; flex-shrink:0; }
.drill-close:hover { color:var(--cyan); border-color:var(--cyan); }
.drill-body { flex:1; overflow-y:auto; padding:14px 16px; }
.sect { margin-bottom:18px; }
.sect-title { font-size:9px; letter-spacing:1.5px; color:var(--dim2); font-weight:600; text-transform:uppercase; margin-bottom:8px; display:flex; align-items:center; gap:6px; }
.sect-title::after { content:""; flex:1; height:1px; background:var(--border); }

.reg-row { display:grid; grid-template-columns: 1fr 60px 44px; align-items:center; gap:8px; padding:5px 0; border-bottom:1px solid rgba(30,41,59,0.6); }
.reg-row .rn { font-size:11px; color:var(--text); }
.reg-row .rbar { height:5px; border-radius:3px; background:var(--border); overflow:hidden; }
.reg-row .rbar > i { display:block; height:100%; border-radius:3px; }
.reg-row .rs { font-family:var(--mono); font-size:12px; font-weight:600; text-align:right; }
.muted { color:var(--dim2); font-size:10px; font-style:italic; }

.evt { font-size:12px; line-height:1.4; }
.evt .et { color:var(--text); }
.evt .em { font-family:var(--mono); font-size:9px; color:var(--dim2); margin-top:2px; display:flex; gap:8px; flex-wrap:wrap; }
a.lnk { color:var(--cyan); text-decoration:none; }
a.lnk:hover { text-decoration:underline; }

.inc-item { display:block; padding:7px 0; border-bottom:1px solid rgba(30,41,59,0.6); text-decoration:none; }
.inc-item:hover .ii-title { color:var(--cyan); }
.inc-item .ii-title { font-size:12px; color:var(--text); line-height:1.35; }
.inc-item .ii-meta { font-family:var(--mono); font-size:9px; color:var(--dim2); margin-top:3px; }
.sev-chip { display:inline-block; padding:1px 6px; border-radius:3px; font-size:8px; font-weight:700; letter-spacing:.5px; border:1px solid; }

.brief-snip { font-size:11px; color:var(--dim); line-height:1.5; }

/* ---------- FOOTER ---------- */
.footer {
  padding:4px 18px; background:var(--panel2); border-top:1px solid var(--border);
  font-size:9px; color:var(--dim2); flex-shrink:0; display:flex; justify-content:space-between; gap:12px;
}

/* scrollbars */
::-webkit-scrollbar { width:8px; height:8px; }
::-webkit-scrollbar-thumb { background:var(--border2); border-radius:4px; }
::-webkit-scrollbar-track { background:transparent; }

@media (max-width:860px) {
  .tape-head, .row { grid-template-columns: 120px 78px 0 80px 1fr 44px 0; }
  .band-spark, .feed-dot, .cell-domain .meta { display:none; }
  .drill.open { position:absolute; right:0; top:0; bottom:0; width:90%; max-width:400px; z-index:50; }
}
</style>
</head>
<body>

<!-- ========== COMPOSITE BAND ========== -->
<div class="band">
  <div class="band-title">OVIX<small>VOLATILITY TAPE</small></div>
  <div class="band-composite">
    <span class="val mono" id="comp-val">--</span>
    <span class="scale">/10</span>
  </div>
  <div class="band-dir">
    <span class="dir-arrow" id="comp-arrow">—</span>
    <span class="dir-delta mono" id="comp-delta">6h</span>
  </div>
  <span class="level-badge" id="comp-level">—</span>
  <span class="vol-badge vol-STABLE" id="comp-vol">VOL —</span>
  <span class="band-spark" id="comp-spark"></span>
  <div class="band-right">
    <span class="feeds" id="feeds">FEEDS <b>—/—</b></span>
    <span class="updated"><span class="pulse"></span><span id="updated">--:--</span></span>
    <div class="transport">
      <button onclick="rocNav('prev')" title="Previous">&#9198;</button>
      <button id="bnr-play" onclick="rocNav('toggle')" title="Play/Pause">&#9654;</button>
      <button onclick="rocNav('next')" title="Next">&#9197;</button>
    </div>
  </div>
</div>

<!-- ========== BODY: TAPE + DRILL ========== -->
<div class="body">
  <div class="tape">
    <div class="tape-head">
      <span>Domain</span><span>Score</span><span>6h Trend</span><span>Volatility</span>
      <span>Top Driver</span><span style="text-align:center">Inc</span><span style="text-align:center">Feed</span>
    </div>
    <div class="rows" id="rows">
      <div style="padding:24px 18px;color:var(--dim2)">Loading tape…</div>
    </div>
  </div>

  <aside class="drill" id="drill">
    <div class="drill-head">
      <div class="dh-left">
        <span class="dh-name" id="d-name">—</span>
        <span class="dh-score mono" id="d-score">—</span>
      </div>
      <button class="drill-close" onclick="closeDrill()" title="Close">&times;</button>
    </div>
    <div class="drill-body" id="drill-body"></div>
  </aside>
</div>

<div class="footer">
  <span>OVIX Volatility Tape · scores &amp; series from canonical /api/ovix endpoints · regional breakdown via /api/ovix/composite</span>
  <span id="foot-status">—</span>
</div>

<script>
(function() {
  "use strict";
  var OVIX_API = 'https://ovix-api.tedlango.workers.dev';
  var REFRESH_MS = 30000;

  // Curated operator-relevant regions for the drill breakdown (intersected with the
  // live registry at load). Macro regions + key BPO/contact-center metro hubs.
  var MACRO_REGIONS = ['north-america','emea','apac','south-america','australia-nz'];
  var METRO_CANDIDATES = [
    'manila','cebu','mumbai','bengaluru','bangalore','delhi','hyderabad','chennai',
    'london','dublin','mexico-city','bogota','cairo','johannesburg','warsaw',
    'kuala-lumpur','jakarta','sao-paulo','san-jose','guatemala-city','lisbon'
  ];

  // ---- color / label helpers (render-only; NEVER compute scores client-side) ----
  function levelOf(d) { return d.level || (d.score >= 7 ? 'HIGH' : d.score >= 4 ? 'ELEVATED' : 'NORMAL'); }
  function levelColor(level) {
    if (level === 'HIGH') return 'var(--red)';
    if (level === 'ELEVATED') return 'var(--amber)';
    return 'var(--green)';
  }
  function scoreColorByLevel(d) { return levelColor(levelOf(d)); }

  // ---- state ----
  var state = {
    scores: null,           // /api/ovix/scores
    seriesByDomain: {},      // domain -> {points, volatility, volatilityLevel}
    compositeSeries: [],
    incByDomain: {},         // domain -> [open incidents]
    regions: null,           // /api/ovix/regions
    regionCache: {},         // regionId -> composite response
    selected: null,          // selected domain key
    lastScores: {}           // domain -> previous score (for flash)
  };

  // ============================================================
  //  SPARKLINE (inline SVG) — renders SHAPE of a points[] series.
  //  Honest nuance: the series is a mean across region snapshots, so its
  //  last point is the trend shape, NOT the headline value — we never
  //  assert equality. Sparse/empty series degrade to a flat dim line.
  // ============================================================
  function sparkline(points, w, h, color) {
    w = w || 104; h = h || 24;
    var vals = (points || []).map(function(p) { return p.score; }).filter(function(v) { return typeof v === 'number'; });
    if (vals.length < 2) {
      // graceful degrade — non-geo / sparse domains
      return '<svg width="' + w + '" height="' + h + '" aria-hidden="true">' +
        '<line x1="2" y1="' + (h/2) + '" x2="' + (w-2) + '" y2="' + (h/2) +
        '" stroke="var(--border2)" stroke-width="1.5" stroke-dasharray="3 3"/></svg>';
    }
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    var range = (max - min) || 1;
    var pad = 2, iw = w - pad * 2, ih = h - pad * 2;
    var pts = vals.map(function(v, i) {
      var x = pad + (i / (vals.length - 1)) * iw;
      var y = pad + ih - ((v - min) / range) * ih;
      return x.toFixed(1) + ',' + y.toFixed(1);
    });
    var last = pts[pts.length - 1].split(',');
    var area = 'M' + pad + ',' + (h - pad) + ' L' + pts.join(' L') + ' L' + (w - pad) + ',' + (h - pad) + ' Z';
    return '<svg width="' + w + '" height="' + h + '" aria-hidden="true">' +
      '<path d="' + area + '" fill="' + color + '" opacity="0.12"/>' +
      '<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + color + '" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<circle cx="' + last[0] + '" cy="' + last[1] + '" r="2.1" fill="' + color + '"/></svg>';
  }

  // 6h trend delta from the series (first vs last point). This is a difference of
  // values the endpoint returned — display math, not a score computation.
  function trendDelta(points) {
    var vals = (points || []).map(function(p) { return p.score; }).filter(function(v) { return typeof v === 'number'; });
    if (vals.length < 2) return null;
    return vals[vals.length - 1] - vals[0];
  }
  function dirArrow(delta) {
    if (delta === null || Math.abs(delta) < 0.15) return { ch: '—', color: 'var(--dim2)' };
    return delta > 0 ? { ch: '▲', color: 'var(--amber)' } : { ch: '▼', color: 'var(--green)' };
  }
  function fmtDelta(delta) {
    if (delta === null) return '—';
    return (delta >= 0 ? '+' : '') + delta.toFixed(1);
  }
  function volLevelOf(domain) {
    var s = state.seriesByDomain[domain];
    return (s && s.volatilityLevel) ? s.volatilityLevel : null;
  }

  // ============================================================
  //  HEAT SORT — FOREMAN default: float HIGH-volatility domains to the top
  //  (rapid change outranks a high-but-flat score), else by score desc.
  //  Kept isolated so Ted can swap to pure-score or a blended weight in one line.
  // ============================================================
  function heatSort(domains) {
    return domains.slice().sort(function(a, b) {
      var ah = volLevelOf(a.domain) === 'HIGH' ? 1 : 0;
      var bh = volLevelOf(b.domain) === 'HIGH' ? 1 : 0;
      if (ah !== bh) return bh - ah;
      return b.score - a.score;
    });
  }

  // ============================================================
  //  FETCH
  // ============================================================
  function getJSON(url, opts) {
    return fetch(url, opts).then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  }

  function loadRegions() {
    return getJSON(OVIX_API + '/api/ovix/regions').then(function(d) {
      state.regions = d;
    }).catch(function() { state.regions = null; });
  }

  function loadIncidents() {
    // Same-origin Hub route; raw SQL, no where-filter — fetch two pages, filter open client-side.
    return Promise.all([
      getJSON('/api/incidents?limit=100&offset=0').catch(function() { return { docs: [] }; }),
      getJSON('/api/incidents?limit=100&offset=100').catch(function() { return { docs: [] }; })
    ]).then(function(pages) {
      var docs = (pages[0].docs || []).concat(pages[1].docs || []);
      var by = {};
      docs.forEach(function(inc) {
        if (inc.status !== 'open') return;
        var dom = inc.domain || 'unknown';
        (by[dom] = by[dom] || []).push(inc);
      });
      // strongest severity first
      Object.keys(by).forEach(function(k) {
        by[k].sort(function(a, b) { return (b.severity || 0) - (a.severity || 0); });
      });
      state.incByDomain = by;
    }).catch(function() { state.incByDomain = {}; });
  }

  function loadCore() {
    return Promise.all([
      getJSON(OVIX_API + '/api/ovix/scores').catch(function() { return null; }),
      getJSON(OVIX_API + '/api/ovix/scores/series?hours=6&region=global').catch(function() { return null; }),
      loadIncidents()
    ]).then(function(res) {
      if (res[0]) state.scores = res[0];
      var s = res[1];
      state.seriesByDomain = {};
      state.compositeSeries = [];
      if (s) {
        (s.domains || []).forEach(function(d) {
          state.seriesByDomain[d.domain] = { points: d.points || [], volatility: d.volatility, volatilityLevel: d.volatilityLevel };
        });
        state.compositeSeries = s.composite_series || [];
      }
    });
  }

  // ============================================================
  //  RENDER — composite band
  // ============================================================
  function renderBand() {
    var d = state.scores; if (!d) return;
    var comp = (typeof d.composite === 'number') ? d.composite : 0;
    var level = comp >= 7 ? 'HIGH' : comp >= 4 ? 'ELEVATED' : 'NORMAL';
    var color = levelColor(level);

    var valEl = document.getElementById('comp-val');
    valEl.textContent = comp.toFixed(1); valEl.style.color = color;

    var lb = document.getElementById('comp-level');
    lb.textContent = level; lb.style.color = color; lb.style.borderColor = color;

    var delta = trendDelta(state.compositeSeries);
    var arr = dirArrow(delta);
    var aEl = document.getElementById('comp-arrow');
    aEl.textContent = arr.ch; aEl.style.color = arr.color;
    document.getElementById('comp-delta').textContent = fmtDelta(delta) + ' /6h';
    document.getElementById('comp-delta').style.color = arr.color;

    document.getElementById('comp-spark').innerHTML = sparkline(state.compositeSeries, 150, 30, color);

    // composite volatility badge — derived from the headline level band of the trend (display only)
    var cv = document.getElementById('comp-vol');
    var compVolLvl = (delta !== null && Math.abs(delta) >= 1.5) ? 'HIGH' : (delta !== null && Math.abs(delta) >= 0.6) ? 'RISING' : 'STABLE';
    cv.className = 'vol-badge vol-' + compVolLvl;
    cv.textContent = 'VOL ' + compVolLvl;

    // feed health — proxy: domains reporting events / total (honest, no feed-health field in API)
    var domains = d.domains || [];
    var reporting = domains.filter(function(x) { return (x.eventCount || 0) > 0; }).length;
    document.getElementById('feeds').innerHTML = 'FEEDS <b>' + reporting + '/' + domains.length + '</b>';

    var when = d.lastUpdated ? new Date(d.lastUpdated) : new Date();
    var hh = String(when.getHours()).padStart(2, '0'), mm = String(when.getMinutes()).padStart(2, '0');
    document.getElementById('updated').textContent = hh + ':' + mm;
    document.getElementById('foot-status').textContent = 'updated ' + hh + ':' + mm + ' local · ' + (d.source || '');
  }

  // ============================================================
  //  RENDER — the tape rows
  // ============================================================
  function renderRows() {
    var d = state.scores;
    var host = document.getElementById('rows');
    if (!d || !d.domains) { host.innerHTML = '<div style="padding:24px 18px;color:var(--red)">No score data.</div>'; return; }

    var sorted = heatSort(d.domains);
    var changed = {};
    sorted.forEach(function(dom) {
      var prev = state.lastScores[dom.domain];
      if (typeof prev === 'number' && prev !== dom.score) changed[dom.domain] = true;
    });

    host.innerHTML = sorted.map(function(dom) {
      var color = scoreColorByLevel(dom);
      var ser = state.seriesByDomain[dom.domain] || {};
      var delta = trendDelta(ser.points);
      var arr = dirArrow(delta);
      var volLvl = ser.volatilityLevel || '—';
      var volClass = (volLvl === 'HIGH' || volLvl === 'RISING' || volLvl === 'STABLE') ? volLvl : 'STABLE';
      var volTxt = (typeof ser.volatility === 'number') ? (volLvl + ' ' + ser.volatility.toFixed(2)) : '—';
      var incs = state.incByDomain[dom.domain] || [];
      var feedOk = (dom.eventCount || 0) > 0;
      var sel = state.selected === dom.domain ? ' selected' : '';
      var flash = changed[dom.domain] ? ' flash' : '';
      var driver = dom.topEvent || '—';

      return '<div class="row' + sel + flash + '" data-domain="' + dom.domain + '">' +
        '<div class="cell-domain"><span class="name">' + dom.domain.replace(/-/g, ' ') + '</span>' +
          '<span class="meta">' + (dom.eventCount || 0) + ' evt · ' + (dom.topSource || '—') + '</span></div>' +
        '<div class="cell-score"><span class="s" style="color:' + color + '">' + dom.score.toFixed(1) + '</span>' +
          '<span class="cell-dir"><span class="a" style="color:' + arr.color + '">' + arr.ch + '</span>' +
          '<span class="d" style="color:' + arr.color + '">' + fmtDelta(delta) + '</span></span></div>' +
        '<div>' + sparkline(ser.points, 104, 24, color) + '</div>' +
        '<div><span class="vol-badge vol-' + volClass + '">' + volTxt + '</span></div>' +
        '<div class="cell-driver" title="' + esc(driver) + '">' + esc(driver) + '</div>' +
        '<div style="text-align:center"><span class="inc-badge' + (incs.length ? '' : ' zero') + '">' + incs.length + '</span></div>' +
        '<div><span class="feed-dot ' + (feedOk ? 'ok' : 'dead') + '" title="' + (feedOk ? 'reporting' : 'no events — check feed') + '"></span></div>' +
      '</div>';
    }).join('');

    // bind clicks + record current scores for next-poll flash
    Array.prototype.forEach.call(host.querySelectorAll('.row'), function(r) {
      r.addEventListener('click', function() { openDrill(r.getAttribute('data-domain')); });
    });
    state.lastScores = {};
    d.domains.forEach(function(dom) { state.lastScores[dom.domain] = dom.score; });
  }

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function(c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  // ============================================================
  //  DRILL PANEL
  // ============================================================
  function domainObj(key) {
    return ((state.scores && state.scores.domains) || []).filter(function(x) { return x.domain === key; })[0];
  }

  function openDrill(key) {
    state.selected = key;
    document.getElementById('drill').classList.add('open');
    renderRows();
    renderDrill();
  }
  window.closeDrill = function() {
    state.selected = null;
    document.getElementById('drill').classList.remove('open');
    renderRows();
  };

  function renderDrill() {
    var key = state.selected; if (!key) return;
    var dom = domainObj(key); if (!dom) return;
    var color = scoreColorByLevel(dom);

    document.getElementById('d-name').textContent = key.replace(/-/g, ' ');
    var ds = document.getElementById('d-score');
    ds.textContent = dom.score.toFixed(1); ds.style.color = color;

    var body = document.getElementById('drill-body');
    var ser = state.seriesByDomain[key] || {};

    // --- trend block ---
    var delta = trendDelta(ser.points);
    var arr = dirArrow(delta);
    var html = '';
    html += '<div class="sect"><div class="sect-title">6h Trend (shape)</div>' +
      '<div style="display:flex;align-items:center;gap:12px">' +
      sparkline(ser.points, 200, 44, color) +
      '<div><div class="mono" style="font-size:13px;color:' + arr.color + '">' + arr.ch + ' ' + fmtDelta(delta) + '</div>' +
      '<div class="muted" style="font-style:normal">vol ' + (typeof ser.volatility === 'number' ? ser.volatility.toFixed(2) : '—') +
      ' · ' + (ser.volatilityLevel || '—') + '</div></div></div>' +
      '<div class="muted">Headline ' + dom.score.toFixed(1) + ' is current; the sparkline shows the trend shape (mean across regions) — values may differ.</div></div>';

    // --- driving event ---
    html += '<div class="sect"><div class="sect-title">Driving Event</div>';
    if (dom.topEvent) {
      html += '<div class="evt"><div class="et">' + esc(dom.topEvent) + '</div>' +
        '<div class="em"><span>source: ' + esc(dom.topSource || '—') + '</span>' +
        '<span>' + (dom.eventCount || 0) + ' events in domain</span>' +
        (dom.geographic ? '<a class="lnk" href="/roc/globe/globe.html" title="Open globe">show on globe ↗</a>' : '') +
        '</div></div>';
    } else { html += '<div class="muted">No top event reported.</div>'; }
    html += '</div>';

    // --- open incidents ---
    var incs = state.incByDomain[key] || [];
    html += '<div class="sect"><div class="sect-title">Open Incidents (' + incs.length + ')</div>';
    if (incs.length) {
      html += incs.slice(0, 8).map(function(inc) {
        var sc = sevColor(inc.severity_level);
        return '<a class="inc-item" href="/incidents/' + esc(inc.slug || '') + '">' +
          '<span class="sev-chip" style="color:' + sc + ';border-color:' + sc + '">' + esc(inc.severity_level || ('SEV' + (inc.severity || '?'))) + '</span> ' +
          '<span class="ii-title">' + esc(inc.title || 'Untitled') + '</span>' +
          '<div class="ii-meta">' + esc((inc.affected_regions || []).slice(0, 3).join(', ') || inc.location_country || '') +
          ' · declared ' + fmtDate(inc.declared_at) + '</div></a>';
      }).join('');
    } else { html += '<div class="muted">No open incidents in this domain.</div>'; }
    html += '</div>';

    // --- regional breakdown (placeholder until composite calls resolve) ---
    html += '<div class="sect"><div class="sect-title">Regional Breakdown</div><div id="reg-host"><div class="muted">Loading regions…</div></div></div>';

    // --- latest brief (member-gated; degrade gracefully) ---
    html += '<div class="sect"><div class="sect-title">Latest Brief</div><div id="brief-host"><div class="muted">Loading…</div></div></div>';

    body.innerHTML = html;
    loadRegionBreakdown(key);
    loadBrief(key);
  }

  function sevColor(lvl) {
    if (!lvl) return 'var(--dim)';
    lvl = String(lvl).toUpperCase();
    if (lvl.indexOf('CRIT') === 0 || lvl === 'SEV1') return 'var(--red)';
    if (lvl.indexOf('HIGH') === 0 || lvl === 'SEV2') return 'var(--red)';
    if (lvl.indexOf('MED') === 0 || lvl === 'SEV3') return 'var(--amber)';
    return 'var(--green)';
  }
  function fmtDate(s) {
    if (!s) return '—';
    var d = new Date(s); if (isNaN(d)) return '—';
    return (d.getMonth() + 1) + '/' + d.getDate();
  }

  // Regional breakdown via /api/ovix/composite?region=<id>.
  // NOTE: /api/ovix/scores?region= is a no-op (returns global) in api-019; the
  // composite endpoint is the one that genuinely differentiates by region
  // (same domains[] shape, regionName populated) — same source the globe uses.
  function loadRegionBreakdown(key) {
    var host = function() { return document.getElementById('reg-host'); };
    if (!state.regions) { if (host()) host().innerHTML = '<div class="muted">Regional data unavailable.</div>'; return; }

    var metroIds = {};
    (state.regions.metros || []).forEach(function(m) { metroIds[m.id] = m.name; });
    var ids = MACRO_REGIONS.slice();
    METRO_CANDIDATES.forEach(function(m) { if (metroIds[m] && ids.indexOf(m) === -1) ids.push(m); });
    var nameOf = {};
    (state.regions.macroRegions || []).forEach(function(r) { nameOf[r.id] = r.name; });
    Object.keys(metroIds).forEach(function(id) { nameOf[id] = metroIds[id]; });

    Promise.all(ids.map(function(id) {
      if (state.regionCache[id]) return Promise.resolve(state.regionCache[id]);
      return getJSON(OVIX_API + '/api/ovix/composite?region=' + encodeURIComponent(id))
        .then(function(d) { state.regionCache[id] = d; return d; })
        .catch(function() { return null; });
    })).then(function(results) {
      if (state.selected !== key) return; // user moved on
      var rows = [];
      results.forEach(function(d, i) {
        if (!d || !d.domains) return;
        var match = d.domains.filter(function(x) { return x.domain === key; })[0];
        if (!match) return;
        rows.push({ name: d.regionName || nameOf[ids[i]] || ids[i], score: match.score, level: match.level });
      });
      rows.sort(function(a, b) { return b.score - a.score; });
      var h = host(); if (!h) return;
      if (!rows.length) { h.innerHTML = '<div class="muted">No regional figures for this domain.</div>'; return; }
      h.innerHTML = rows.slice(0, 12).map(function(r) {
        var c = levelColor(r.level || (r.score >= 7 ? 'HIGH' : r.score >= 4 ? 'ELEVATED' : 'NORMAL'));
        return '<div class="reg-row"><span class="rn">' + esc(r.name) + '</span>' +
          '<span class="rbar"><i style="width:' + Math.max(4, (r.score / 10) * 100) + '%;background:' + c + '"></i></span>' +
          '<span class="rs" style="color:' + c + '">' + r.score.toFixed(1) + '</span></div>';
      }).join('');
    });
  }

  // Latest brief snippet — /api/newsletter-issues is member-gated; degrade gracefully.
  function loadBrief(key) {
    var host = function() { return document.getElementById('brief-host'); };
    getJSON('/api/newsletter-issues?limit=1&sort=-publishedAt&depth=0').then(function(d) {
      if (state.selected !== key) return;
      var h = host(); if (!h) return;
      var doc = (d.docs || [])[0];
      if (!doc) { h.innerHTML = '<div class="muted">No briefs published.</div>'; return; }
      var title = doc.title || doc.subject || 'Latest brief';
      var snip = (doc.summary || doc.excerpt || doc.preheader || '').toString().slice(0, 240);
      h.innerHTML = '<div class="brief-snip"><a class="lnk" href="/briefs">' + esc(title) + '</a>' +
        (snip ? '<div style="margin-top:4px">' + esc(snip) + '…</div>' : '') + '</div>';
    }).catch(function() {
      if (state.selected !== key) return;
      var h = host(); if (h) h.innerHTML = '<div class="muted">Briefs are in the members area — <a class="lnk" href="/briefs">open briefs ↗</a></div>';
    });
  }

  // ============================================================
  //  BOOT + REFRESH
  // ============================================================
  function refresh() {
    return loadCore().then(function() {
      renderBand();
      renderRows();
      if (state.selected) renderDrill();
    }).catch(function() {});
  }

  loadRegions();
  loadCore().then(function() {
    renderBand();
    renderRows();
  });
  setInterval(refresh, REFRESH_MS);
})();
</script>

<!-- ========== ROC CAROUSEL ROTATION (preserved from prior scores.html) ========== -->
<script>
window.rocNav = function(a) {
  ROUTES = {globe:'/roc/globe/globe.html',scores:'/roc/dashboards/scores.html',weather:'/roc/dashboards/weather.html',seismic:'/roc/dashboards/seismic.html',disaster:'/roc/dashboards/disaster.html',cyber:'/roc/dashboards/cyber.html',health:'/roc/dashboards/health.html',infrastructure:'/roc/dashboards/infrastructure.html',financial:'/roc/dashboards/financial.html',environmental:'/roc/dashboards/environmental.html',geopolitical:'/roc/dashboards/geopolitical.html',travel:'/roc/dashboards/travel.html',labor:'/roc/dashboards/labor.html','supply-chain':'/roc/dashboards/supply-chain.html'};
  var ORDER = ['globe','scores','weather','seismic','disaster','cyber','health','infrastructure','financial','environmental','geopolitical','travel','labor','supply-chain'];
  var K = 'roc-rotation';
  function gs() { try { return JSON.parse(localStorage.getItem(K))||{}; } catch(e) { return {}; } }
  function ss(s) { try { localStorage.setItem(K,JSON.stringify(s)); } catch(e) {} }
  var en = gs().enabledSlides || ORDER.slice(), p = window.location.pathname, cur = 'scores';
  for (var k in ROUTES) { if (p.indexOf(ROUTES[k])!==-1) { cur=k; break; } }
  var i = en.indexOf(cur); if (i===-1) i=0;
  if (a==='prev') window.location = ROUTES[en[(i-1+en.length)%en.length]];
  else if (a==='next') window.location = ROUTES[en[(i+1)%en.length]];
  else if (a==='toggle') { var s=gs(); s.active=!s.active; if(!s.interval)s.interval=30; ss(s); updateTransportUI(); if(s.active){var nx=en[(i+1)%en.length]; setTimeout(function(){var c=gs();if(!c.active)return;window.location=ROUTES[nx];},(s.interval||30)*1000);} }
  else if (a==='speed') { var s2=gs(); s2.interval=parseInt(document.getElementById('bnr-speed').value)||30; ss(s2); }
};
function updateTransportUI(){var s;try{s=JSON.parse(localStorage.getItem('roc-rotation'))||{};}catch(e){s={};}var b=document.getElementById('bnr-play'),ind=document.getElementById('rotation-indicator');if(b){b.textContent=s.active?'⏸':'▶';b.style.background=s.active?'rgba(34,211,238,0.25)':'rgba(34,211,238,0.07)';}if(ind)ind.style.display=s.active?'block':'none';var sp=document.getElementById('bnr-speed');if(sp&&s.interval)sp.value=String(s.interval);}
updateTransportUI();
(function(){try{var s=JSON.parse(localStorage.getItem('roc-rotation')||'{}');}catch(e){return;}if(!s.active)return;var ri=document.getElementById('rotation-indicator');if(ri)ri.style.display='block';ROUTES = {globe:'/roc/globe/globe.html',scores:'/roc/dashboards/scores.html',weather:'/roc/dashboards/weather.html',seismic:'/roc/dashboards/seismic.html',disaster:'/roc/dashboards/disaster.html',cyber:'/roc/dashboards/cyber.html',health:'/roc/dashboards/health.html',infrastructure:'/roc/dashboards/infrastructure.html',financial:'/roc/dashboards/financial.html',environmental:'/roc/dashboards/environmental.html',geopolitical:'/roc/dashboards/geopolitical.html',travel:'/roc/dashboards/travel.html',labor:'/roc/dashboards/labor.html','supply-chain':'/roc/dashboards/supply-chain.html'};var ORDER = ['globe','scores','weather','seismic','disaster','cyber','health','infrastructure','financial','environmental','geopolitical','travel','labor','supply-chain'];var en=s.enabledSlides||ORDER.slice();var cur='scores';var p=window.location.pathname;for(var k in ROUTES){if(p.indexOf(ROUTES[k])!==-1){cur=k;break;}}var i=en.indexOf(cur);if(i===-1)i=0;var nx=en[(i+1)%en.length];setTimeout(function(){try{var c=JSON.parse(localStorage.getItem('roc-rotation')||'{}');}catch(e2){return;}if(!c.active)return;window.location=ROUTES[nx];},(s.interval||30)*1000);})();
</script>
